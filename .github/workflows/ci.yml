# Same checks as `aos test`, on a clean Windows machine, for every push and pull request.
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node 22.6+ runs the Pi permission-gate tests (TypeScript, type stripping); pin the local version.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pester 5 for Windows PowerShell 5.1 and PowerShell 7
        shell: pwsh
        run: |
          Import-Module ./aos.psm1 -DisableNameChecking
          & (Get-Module aos) { Install-AosPester }

      - name: aos test
        shell: pwsh
        run: |
          Import-Module ./aos.psm1 -DisableNameChecking
          aos test
          exit $LASTEXITCODE
